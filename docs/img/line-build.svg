<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 150" width="940" height="150" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Build and ship — approved intent in, verified code out</title>
<desc>An approving review at Gate 1 starts the build. The build opens implementation PRs, which verify, review, drift and quality checks all run against. A human merges each one at Gate 2 — the line never merges an implementation PR. Once every one is merged the spec is archived into the living spec and the issue closes.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#57606a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7781"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ff454f"/></marker></defs>
<rect width="940" height="150" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<rect x="33.0" y="46" width="160" height="40" rx="7" fill="#ff454f14" stroke="#ff454f" stroke-width="1.6"/>
<text x="113.0" y="63" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">GATE 1</text>
<text x="113.0" y="78" text-anchor="middle" font-size="10.5" fill="#ff454f">a human approves</text>
<rect x="225.0" y="46" width="84" height="40" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="267.0" y="70.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">build</text>
<rect x="341.0" y="46" width="112" height="40" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="397.0" y="70.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">impl PR(s)</text>
<rect x="485.0" y="46" width="180" height="40" rx="7" fill="#ff454f14" stroke="#ff454f" stroke-width="1.6"/>
<text x="575.0" y="63" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">GATE 2</text>
<text x="575.0" y="78" text-anchor="middle" font-size="10.5" fill="#ff454f">a human merges each</text>
<rect x="697.0" y="46" width="210" height="40" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="802.0" y="70.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">spec archived · issue closed</text>
<line x1="198.0" y1="66.0" x2="220.0" y2="66.0" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="314.0" y1="66.0" x2="336.0" y2="66.0" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="458.0" y1="66.0" x2="480.0" y2="66.0" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="670.0" y1="66.0" x2="692.0" y2="66.0" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="397.0" y1="86" x2="397.0" y2="99" stroke="#d0d7de" stroke-width="1.4"/>
<text x="397.0" y="114" text-anchor="middle" font-size="11" font-weight="400" fill="#6e7781">verify · review · drift · quality</text>
</svg>
