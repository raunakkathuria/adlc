<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 212" width="940" height="212" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Intake — anything in, one shape out</title>
<desc>An issue is opened and triaged. Triage can close it as not actionable. A bug goes to the reproduce station, where it becomes a failing test, or is closed as not reproducible and can be reopened to re-enter the line. A feature or chore has nothing to reproduce and goes straight on. Either way the work becomes a spec PR.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#57606a"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#6e7781"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#ff454f"/></marker></defs>
<rect width="940" height="212" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<rect x="78.0" y="66" width="132" height="40" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="144.0" y="90.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">issue opened</text>
<rect x="286.0" y="66" width="96" height="40" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="334.0" y="90.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">triage</text>
<rect x="480.0" y="66" width="196" height="40" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="578.0" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">reproduce</text>
<text x="578.0" y="98" text-anchor="middle" font-size="10.5" fill="#6e7781">the bug becomes a failing test</text>
<rect x="752.0" y="66" width="110" height="40" rx="7" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="807.0" y="90.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">spec PR</text>
<line x1="215.0" y1="86.0" x2="281.0" y2="86.0" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="387.0" y1="86.0" x2="475.0" y2="86.0" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<line x1="681.0" y1="86.0" x2="747.0" y2="86.0" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="431.0" y="78" text-anchor="middle" font-size="10.5" font-weight="600" fill="#57606a">bug</text>
<path d="M 334.0 61 L 334.0 32 L 807.0 32 L 807.0 59" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#a)"/>
<text x="570.5" y="25" text-anchor="middle" font-size="10.5" font-weight="400" fill="#57606a">feature · chore — nothing to reproduce</text>
<rect x="247.0" y="140" width="130" height="48" rx="6" fill="#00000008" stroke="#6e7781" stroke-width="1" stroke-dasharray="3 3"/>
<text x="312.0" y="159" text-anchor="middle" font-size="11" fill="#6e7781">closed</text>
<text x="312.0" y="173" text-anchor="middle" font-size="11" fill="#6e7781">not actionable</text>
