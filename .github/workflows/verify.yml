# The gate. No model in it, nothing to install, runs in seconds.
#
# This is the same command AGENTS.md tells every agent to run before it says it is done, and the
# same one check.sh runs at setup. One gate, three callers.

name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No `npm ci` — there are no dependencies. That is deliberate.
      - run: npm run verify

      # A run: block is shell, and nothing was checking it. actionlint hands shell linting to
      # shellcheck and skips it silently when shellcheck is missing, so an `if` with no `fi` sat
      # in intake.yml from the start and the reproduce station never once ran.
      - run: npm run lint-workflows
