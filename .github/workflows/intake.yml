# Station: intake — triage, then (for bugs) validation by reproduction.
#
# Every issue that lands in the repo enters the line here, automatically. Triage decides one
# thing: is this actionable work, and what kind? Not actionable → closed with the reason.
# A bug → the reproduce station writes the failing test that makes it real; not reproducible →
# closed with the report, reopenable. Actionable → dispatched to the spec station, because
# every change here is spec-driven.
#
# OFF unless the ADLC_API_KEY or ADLC_OAUTH_TOKEN secret is set: without either this
# workflow explains itself and stops. A repo that can open PRs on its own should require a human to
# switch it on.
#
# SECURITY: issue text is attacker-controlled and model output is attacker-influenced, so
# neither ever reaches a shell via ${{ }} — values travel as files or env vars, and the parse
# step validates every field against a strict shape before it becomes an output.
#
# Consumers adopt this station with a thin caller: uses: raunakkathuria/adlc/.github/workflows/intake.yml@v1

name: intake

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to (re-)run intake for"
        required: true
        type: string
  workflow_call:
    inputs:
      issue_number:
        required: false
        type: string
      adlc_repo:
        description: "Hub repo holding prompts/ and scripts/"
        required: false
        type: string
        default: raunakkathuria/adlc
      adlc_ref:
        required: false
        type: string
        default: main
    secrets:
      ADLC_API_KEY:
        required: false
      ADLC_OAUTH_TOKEN:
        required: false

permissions:
  contents: read
  issues: write
  actions: write # dispatches spec.yml

concurrency:
  group: adlc-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue_number }}
  ADLC_REPO: ${{ inputs.adlc_repo || 'raunakkathuria/adlc' }}
  ADLC_REF: ${{ inputs.adlc_ref || 'main' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      on: ${{ steps.runner.outputs.on }}
      route: ${{ steps.verdict.outputs.route }}
      slug: ${{ steps.verdict.outputs.slug }}
    steps:
      - uses: actions/checkout@v7

      - name: Is the line switched on?
        id: runner
        env:
          KEY: ${{ secrets.ADLC_API_KEY }}
          OAUTH: ${{ secrets.ADLC_OAUTH_TOKEN }}
        run: |
          if [ -z "${KEY:-}" ] && [ -z "${OAUTH:-}" ]; then
            echo "No ADLC_API_KEY or ADLC_OAUTH_TOKEN secret. The line stays off — this workflow is documentation."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the line's prompts and scripts
        if: steps.runner.outputs.on == 'true' && github.repository != env.ADLC_REPO
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ADLC_REPO }}
          ref: ${{ env.ADLC_REF }}
          path: .adlc
      - name: Point at them
        if: steps.runner.outputs.on == 'true'
        run: echo "ADLC=$([ -d .adlc ] && echo .adlc || echo .)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        if: steps.runner.outputs.on == 'true'
        with:
          node-version: 22

      - name: Labels exist, and this issue is at the triage station
        if: steps.runner.outputs.on == 'true'
        run: |
          node "$ADLC/scripts/labels.mjs" ensure
          node "$ADLC/scripts/labels.mjs" state "$ISSUE" triaging

      # Depth guard: an issue filed by a run that was itself working a machine-filed issue
      # waits for a human. Depth 1 runs; depth 2 parks — until a person removes needs-human
      # and re-runs intake, which is the documented way past the brake.
      - name: Depth guard
        if: steps.runner.outputs.on == 'true'
        id: depth
        run: |
          DEPTH=$(node "$ADLC/scripts/links.mjs" read "$ISSUE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).depth??0))')
          echo "Machine-filing depth: $DEPTH"
          if [ "$DEPTH" -lt 2 ]; then
            echo "parked=false" >> "$GITHUB_OUTPUT"
          else
            LABELS=$(gh issue view "$ISSUE" --json labels --jq '[.labels[].name] | join(",")')
            PARKED_BEFORE=$(gh issue view "$ISSUE" --json comments --jq '[.comments[].body | select(contains("<!-- adlc-depth-parked -->"))] | length')
            if [ "$PARKED_BEFORE" -gt 0 ] && ! echo ",$LABELS," | grep -q ",needs-human,"; then
              echo "A person cleared needs-human after the depth park — proceeding."
              echo "parked=false" >> "$GITHUB_OUTPUT"
            else
              node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human
              gh issue comment "$ISSUE" --body "$(printf -- '<!-- adlc-depth-parked -->\nThis issue was filed by a run that was itself investigating a machine-filed issue (depth %s). The line parks here by design — a person should confirm it before more automated work is spent on it. Remove the \`needs-human\` label and re-run intake (\`gh workflow run intake.yml -f issue_number=%s\`) to proceed.' "$DEPTH" "$ISSUE")"
              echo "parked=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # The issue becomes files: every later step reads the same bytes, and nothing from the
      # issue body is ever interpolated into a shell command — it is data, not instructions.
      - name: Take the issue in, as data
        if: steps.runner.outputs.on == 'true' && steps.depth.outputs.parked == 'false'
        run: |
          mkdir -p work
          gh issue view "$ISSUE" --json number,title,body,author,labels > work/issue.json
          node -e '
            const i = require("./work/issue.json");
            const fs = require("fs");
            fs.writeFileSync("work/issue.md", `# ${i.title}\n\n(issue #${i.number}, by @${i.author.login})\n\n${i.body ?? ""}\n`);
          '
          gh issue list --state all --limit 100 --json number,title,state,stateReason,labels \
            --jq '[.[] | select(.number != ('"$ISSUE"'|tonumber))]' > work/existing.json
          node -e '
            const all = require("./work/existing.json");
            const fs = require("fs");
            // Why a closed issue closed is the whole question: shipped means the work is done,
            // not-planned means somebody declined it and the problem may well still be there.
            const why = (i) => {
              if (i.state !== "CLOSED") return "";
              if (i.labels.some((l) => l.name === "resolution:not-reproducible")) return " · not-reproducible";
              if (i.stateReason === "COMPLETED" || i.labels.some((l) => l.name === "state:shipped")) return " · shipped";
              return " · not planned, so the problem may remain";
            };
            const line = (i) => `#${i.number} [${i.state}${why(i)}] ${i.title}`;
            fs.writeFileSync("work/existing-issues.md", all.map(line).join("\n") + "\n");
          '

      - name: Install the agent CLI
        if: steps.runner.outputs.on == 'true' && steps.depth.outputs.parked == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Classify it
        if: steps.runner.outputs.on == 'true' && steps.depth.outputs.parked == 'false'
        shell: bash # pipefail: a crashed agent must fail this step, not be hidden by tee
        env:
          ADLC_API_KEY: ${{ secrets.ADLC_API_KEY }}
          ADLC_OAUTH_TOKEN: ${{ secrets.ADLC_OAUTH_TOKEN }}
          ADLC_BASE_URL: ${{ vars.ADLC_BASE_URL }}
          ADLC_MODEL: ${{ vars.ADLC_MODEL }}
        run: |
          bash "$ADLC/scripts/run-station.sh" "$ADLC/prompts/triage.md" "Read,Grep,Glob" \
            'The issue to triage is `work/issue.md`.' \
            'The existing-issues listing is `work/existing-issues.md`.' \
            | tee work/triage.txt

      # Fail closed: an unparseable or malformed verdict parks the issue for a human. It never
      # closes the issue (that would blame the reporter for the model's failure) and never
      # creates work. Every field is validated against a strict shape HERE, so downstream
      # steps and workflows can trust the outputs.
      - name: Parse the verdict
        if: steps.runner.outputs.on == 'true' && steps.depth.outputs.parked == 'false'
        id: verdict
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("work/triage.txt", "utf8");
            const lines = text.split("\n");
            // The object holds machine fields only and the reasoning follows as prose, so a
            // truncated tail costs the explanation and never the verdict.
            const at = lines.findIndex((l) => l.trim().startsWith("{"));
            let v = null;
            try { v = JSON.parse(lines[at]); } catch {}
            const TYPES = ["bug", "feature", "chore", "docs"];
            const SLUG = /^[a-z0-9][a-z0-9-]{0,60}$/;
            const NUM = /^\d+$/;
            let out;
            if (!v || typeof v.actionable !== "boolean") {
              out = { route: "park", slug: "", ref: "" };
            } else {
              const dup = NUM.test(String(v.duplicate_of ?? "")) ? String(v.duplicate_of) : "";
              const rec = NUM.test(String(v.recurrence_of ?? "")) ? String(v.recurrence_of) : "";
              if (rec) out = { route: "recurrence", slug: "", ref: rec };
              else if (dup) out = { route: "duplicate", slug: "", ref: dup };
              else if (!v.actionable) out = { route: "close", slug: "", ref: "" };
              else if (!TYPES.includes(v.type) || !SLUG.test(String(v.slug ?? ""))) out = { route: "park", slug: "", ref: "" };
              else out = { route: v.type === "bug" ? "reproduce" : "spec", slug: v.slug, ref: "", type: v.type };
            }
            const prose = at < 0 ? "" : lines.slice(at + 1).join(" ").replace(/^\s*Why:\s*/i, "");
            const reason = (prose || String(v?.reason ?? "")).replace(/\s+/g, " ").trim().slice(0, 600);
            fs.writeFileSync("work/reason.md", reason);
            fs.writeFileSync("work/type.txt", out.type ?? "");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              `route=${out.route}\nslug=${out.slug}\nref=${out.ref}\n`);
          '
          echo "route: $(grep '^route=' "$GITHUB_OUTPUT" | tail -1 || true)"

      - name: Unparseable or malformed verdict — park, never guess
        if: steps.runner.outputs.on == 'true' && steps.depth.outputs.parked == 'false' && steps.verdict.outputs.route == 'park'
        run: |
          node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human
            # The verdict is model output, so it travels as a file and is indented rather than
            # fenced — a ``` inside it would otherwise break out of the block.
            node -e '
              const fs = require("fs");
              let raw = "";
              try { raw = fs.readFileSync("work/triage.txt", "utf8"); } catch {}
              const excerpt = raw.slice(0, 400).split("\n").map((l) => "    " + l).join("\n");
              fs.writeFileSync("work/park.md",
                "Triage could not produce a valid verdict for this issue, so the line fails closed and parks it. "
                + "A person should look, then re-run intake with `gh workflow run intake.yml -f issue_number="
                + process.env.ISSUE + "`.\n\n"
                + (excerpt.trim() ? "What it emitted, first 400 characters:\n\n" + excerpt + "\n" : "It emitted nothing.\n"));
            '
            gh issue comment "$ISSUE" --body-file work/park.md

      - name: Recurrence — reopen the original, it carries the history
        if: steps.runner.outputs.on == 'true' && steps.verdict.outputs.route == 'recurrence'
        env:
          ORIG: ${{ steps.verdict.outputs.ref }}
        run: |
          gh issue reopen "$ORIG" --comment "Reopened: the same problem was reported again in #$ISSUE. Two independent sightings of a bug that would not reproduce is evidence — intake is re-running with both reports."
          gh issue close "$ISSUE" --reason "not planned" --comment "This matches #$ORIG (closed as not reproducible). That issue has been reopened and carries both reports; the line continues there."
          node "$ADLC/scripts/labels.mjs" add "$ISSUE" resolution:not-actionable
          gh workflow run intake.yml -f issue_number="$ORIG" || echo "::warning::Could not dispatch intake for #$ORIG — run it manually."

      - name: Duplicate — link, close, done
        if: steps.runner.outputs.on == 'true' && steps.verdict.outputs.route == 'duplicate'
        env:
          DUP: ${{ steps.verdict.outputs.ref }}
        run: |
          node "$ADLC/scripts/labels.mjs" add "$ISSUE" resolution:not-actionable
          # The reason is model output. gh issue close takes no --comment-file, so comment then close.
          { printf 'Duplicate of #%s — the line continues there.\n\n> ' "$DUP"
            cat work/reason.md
            printf '\n'
          } > work/dup-comment.md
          gh issue comment "$ISSUE" --body-file work/dup-comment.md
          gh issue close "$ISSUE" --reason "not planned"

      - name: Not actionable — close with the reason
        if: steps.runner.outputs.on == 'true' && steps.verdict.outputs.route == 'close'
        run: |
          node "$ADLC/scripts/labels.mjs" add "$ISSUE" resolution:not-actionable
          # Same shape: the reason is model output, so it is a file and the close carries no comment.
          { printf 'The line triaged this as not actionable and closed it.\n\n> '
            cat work/reason.md
            printf '\n\nIf that is wrong, add the missing detail and reopen — reopening re-enters the line.\n'
          } > work/close-comment.md
          gh issue comment "$ISSUE" --body-file work/close-comment.md
          gh issue close "$ISSUE" --reason "not planned"

      - name: Label the type
        if: steps.runner.outputs.on == 'true' && (steps.verdict.outputs.route == 'spec' || steps.verdict.outputs.route == 'reproduce')
        run: node "$ADLC/scripts/labels.mjs" type "$ISSUE" "$(cat work/type.txt)"

      - name: Not a bug — straight to the spec station
        if: steps.runner.outputs.on == 'true' && steps.verdict.outputs.route == 'spec'
        env:
          SLUG: ${{ steps.verdict.outputs.slug }}
        run: |
          gh workflow run spec.yml -f issue_number="$ISSUE" -f slug="$SLUG" \
            || { node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human; gh issue comment "$ISSUE" --body "Triage passed but the spec station could not be dispatched — parked for a human. Re-run with: \`gh workflow run spec.yml -f issue_number=$ISSUE -f slug=$SLUG\`"; }

  # A bug is only real once a failing test proves it. Reproduced → spec station, with the
  # failing test attached as evidence. Not reproduced → closed with the full report, reopenable.
      # A fail-closed park is only useful if you can see WHY. work/triage.txt is the raw verdict.
      - name: Keep the evidence
        if: always() && steps.runner.outputs.on == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: triage-${{ env.ISSUE }}-${{ github.run_id }}
          path: work/

  reproduce:
    needs: triage
    if: needs.triage.outputs.on == 'true' && needs.triage.outputs.route == 'reproduce'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Get the line's prompts and scripts
        if: github.repository != env.ADLC_REPO
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ADLC_REPO }}
          ref: ${{ env.ADLC_REF }}
          path: .adlc
      - name: Point at them
        run: echo "ADLC=$([ -d .adlc ] && echo .adlc || echo .)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The adopter's dependencies — the line runs their code, so it installs it
        run: bash "$ADLC/scripts/install-deps.sh"

      # If the suite is already red, a failing test proves nothing about THIS report.
      - name: Baseline — the suite must be green before reproduction means anything
        id: baseline
        run: |
          if npm test; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
            node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human
            gh issue comment "$ISSUE" --body "The test suite is already red on the default branch, so a reproduction cannot be attributed to this report. The line is parked — fix the suite, then re-run intake with \`gh workflow run intake.yml -f issue_number=$ISSUE\`."
          fi

      - name: Take the issue in, as data
        if: steps.baseline.outputs.green == 'true'
        run: |
          mkdir -p work
          gh issue view "$ISSUE" --json number,title,body,author,comments > work/issue.json
          node -e '
            const i = require("./work/issue.json");
            const fs = require("fs");
            const thread = (i.comments ?? []).map((c) => `\n---\ncomment by @${c.author?.login}:\n\n${c.body}`).join("\n");
            fs.writeFileSync("work/issue.md", `# ${i.title}\n\n(issue #${i.number}, by @${i.author.login})\n\n${i.body ?? ""}\n${thread}\n`);
          '

      - name: Install the agent CLI
        if: steps.baseline.outputs.green == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Try to reproduce it as a failing test
        if: steps.baseline.outputs.green == 'true'
        shell: bash # pipefail: a crashed agent must fail this step — a green suite after a
                    # crash must never read as "not reproducible"
        env:
          ADLC_API_KEY: ${{ secrets.ADLC_API_KEY }}
          ADLC_OAUTH_TOKEN: ${{ secrets.ADLC_OAUTH_TOKEN }}
          ADLC_BASE_URL: ${{ vars.ADLC_BASE_URL }}
          ADLC_MODEL: ${{ vars.ADLC_MODEL }}
        run: |
          bash "$ADLC/scripts/run-station.sh" "$ADLC/prompts/reproduce.md" \
            "Read,Grep,Glob,Edit,Write,Bash(node:*),Bash(npm:*)" \
            'The report is `work/issue.md`.' \
            | tee work/reproduce.md

      - name: The line's own tools must be untouched
        if: steps.baseline.outputs.green == 'true' && env.ADLC == '.adlc'
        run: |
          if [ -n "$(git -C .adlc status --porcelain)" ]; then
            echo "::error::The agent modified the line's own prompts or scripts (.adlc/) — refusing to continue."
            exit 1
          fi

      # The deterministic question: did anything actually fail? A red test is what makes the
      # bug real. Green means nothing was reproduced — close with the report, reopenable.
      - name: Did anything actually fail?
        if: steps.baseline.outputs.green == 'true'
        id: red
        run: |
          if npm test; then
            echo "reproduced=false" >> "$GITHUB_OUTPUT"
          else
            echo "reproduced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reproduced — keep the failing test as evidence
        if: steps.baseline.outputs.green == 'true' && steps.red.outputs.reproduced == 'true'
        run: |
          git diff > work/repro.patch
          git ls-files --others --exclude-standard -z -- test | while IFS= read -r -d '' f; do
            git diff /dev/null "$f" >> work/repro.patch || true
          done
      - uses: actions/upload-artifact@v7
        if: steps.baseline.outputs.green == 'true' && steps.red.outputs.reproduced == 'true'
        with:
          name: repro-${{ env.ISSUE }}
          path: |
            work/repro.patch
            work/reproduce.md

      - name: Reproduced — record it and hand to the spec station
        if: steps.baseline.outputs.green == 'true' && steps.red.outputs.reproduced == 'true'
        env:
          SLUG: ${{ needs.triage.outputs.slug }}
        run: |
          node "$ADLC/scripts/links.mjs" write "$ISSUE" repro_run="${{ github.run_id }}" \
            --note "Reproduced: a failing test proves this bug is real. The test travels to the build as \`repro-$ISSUE\` from run ${{ github.run_id }}."
          gh workflow run spec.yml -f issue_number="$ISSUE" -f slug="$SLUG" \
            || { node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human; gh issue comment "$ISSUE" --body "Reproduced, but the spec station could not be dispatched — parked for a human. Re-run with: \`gh workflow run spec.yml -f issue_number=$ISSUE -f slug=$SLUG\`"; }

      - name: Not reproducible — close with the report, reopenable
        if: steps.baseline.outputs.green == 'true' && steps.red.outputs.reproduced == 'false'
        run: |
          node "$ADLC/scripts/labels.mjs" add "$ISSUE" resolution:not-reproducible
          gh issue comment "$ISSUE" --body-file work/reproduce.md
          gh issue close "$ISSUE" --reason "not planned" --comment "The reproduce station could not surface this as a failing test — the full report is above. Closed as not reproducible, deliberately: open issues are only things actually moving down the line. Reopen it (or report the problem again) and intake re-runs with all the accumulated reports."

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproduce-${{ env.ISSUE }}-${{ github.run_id }}
          path: work/
