# Station: build — Gate 1 was passed; the Executor implements the approved delta.
#
# The trigger IS the gate: a human with write access submits an APPROVING review on a spec PR
# (branch spec/<slug>, containing only openspec/changes/**). Nothing here decides whether the
# change should exist — a person already did, by approving.
#
# The implementation branches FROM THE SPEC PR HEAD, so the approved delta is the build's input
# and rides inside the implementation PR, then merges main in so the build runs against current
# tooling and the delta cannot arrive twice by two routes. The spec PR itself stays open — it
# merges (or is marked merged by GitHub, since its commits land via the implementation) only
# after Gate 2. That last part needs merge commits: squash and rebase break the ancestry.
#
# Opens an implementation PR. Never merges one — Gate 2 is a person.

name: build

on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Approved spec PR number to build"
        required: true
        type: string
  workflow_call:
    inputs:
      pr_number:
        required: false
        type: string
      adlc_repo:
        required: false
        type: string
        default: raunakkathuria/adlc
      adlc_ref:
        required: false
        type: string
        default: main
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write # dispatches verifier.yml
  statuses: write # the gate's verdict as a commit status (bot-opened PRs get no pull_request runs)

concurrency:
  group: adlc-build-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

env:
  PR: ${{ github.event.pull_request.number || inputs.pr_number }}
  ADLC_REPO: ${{ inputs.adlc_repo || 'raunakkathuria/adlc' }}
  ADLC_REF: ${{ inputs.adlc_ref || 'main' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    # Only an approving review on a spec branch even starts the job; everything else is guarded inside.
    if: github.event_name != 'pull_request_review' || (github.event.review.state == 'approved' && startsWith(github.event.pull_request.head.ref, 'spec/'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is the line switched on?
        id: runner
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${KEY:-}" ] && [ -z "${OAUTH:-}" ]; then
            echo "No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret. The line stays off — this workflow is documentation."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      # Gate 1's fine print, checked deterministically:
      #   - the PR is open, its branch is spec/<slug>, and it touches ONLY openspec/changes/**
      #   - the approver has write access (a drive-by approval from a fork must not start a build)
      #   - the source issue is recorded (the workflow wrote "Relates to #N" when it opened the PR)
      - name: Gate 1 fine print
        if: steps.runner.outputs.on == 'true'
        id: gate
        env:
          REVIEWER: ${{ github.event.review.user.login || github.actor }}
        run: |
          mkdir -p work
          gh pr view "$PR" --json state,headRefName,files,body,reviews > work/pr.json
          node -e '
            const pr = require("./work/pr.json");
            const fs = require("fs");
            const fail = (why) => { console.log(`skip: ${why}`); fs.appendFileSync(process.env.GITHUB_OUTPUT, `ok=false\nwhy=${why}\n`); process.exit(0); };
            if (pr.state !== "OPEN") fail("the spec PR is not open");
            if (!pr.headRefName.startsWith("spec/")) fail("not a spec branch");
            const slug = pr.headRefName.slice("spec/".length);
            if (!/^[a-z0-9][a-z0-9-]{0,60}$/.test(slug)) fail("branch name is not a valid change slug");
            const offside = pr.files.filter((f) => !f.path.startsWith("openspec/changes/"));
            if (offside.length) fail("the PR touches files outside openspec/changes/ - not a pure spec PR");
            const issue = ((pr.body ?? "").match(/Relates to #(\d+)/) ?? [])[1];
            if (!issue) fail("no Relates-to issue recorded on the PR");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ok=true\nissue=${issue}\nslug=${slug}\n`);
          '
          APPROVER="$REVIEWER"
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/$APPROVER/permission" --jq .permission)
          echo "Approver $APPROVER has permission: $PERM"
          case "$PERM" in
            admin|write|maintain) echo "approver_ok=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "approver_ok=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Not buildable — say why and stop
        if: steps.runner.outputs.on == 'true' && (steps.gate.outputs.ok != 'true' || steps.gate.outputs.approver_ok != 'true')
        run: |
          echo "Gate 1 fine print not met: ${{ steps.gate.outputs.why || 'approver lacks write access' }}"
          if [ "${{ steps.gate.outputs.approver_ok }}" = "false" ]; then
            gh pr comment "$PR" --body "An approving review was submitted, but the reviewer does not have write access to this repository, so the build did not start. Gate 1 requires an approval from a maintainer."
          fi

      - name: Get the line's prompts and scripts
        if: steps.runner.outputs.on == 'true' && steps.gate.outputs.ok == 'true' && steps.gate.outputs.approver_ok == 'true' && github.repository != env.ADLC_REPO
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ADLC_REPO }}
          ref: ${{ env.ADLC_REF }}
          path: .adlc
      - name: Point at them
        if: steps.runner.outputs.on == 'true' && steps.gate.outputs.ok == 'true' && steps.gate.outputs.approver_ok == 'true'
        run: |
          echo "ADLC=$([ -d .adlc ] && echo .adlc || echo .)" >> "$GITHUB_ENV"
          echo "GO=true" >> "$GITHUB_ENV"
          echo "ISSUE=${{ steps.gate.outputs.issue }}" >> "$GITHUB_ENV"
          echo "SLUG=${{ steps.gate.outputs.slug }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        if: env.GO == 'true'
        with:
          node-version: 22

      # The loop cap: a re-approval after verifier findings is round two; round three parks.
      - name: Count this attempt
        if: env.GO == 'true'
        id: attempts
        run: |
          if node "$ADLC/scripts/attempts.mjs" record "$ISSUE" build; then
            echo "within=true" >> "$GITHUB_OUTPUT"
          else
            echo "within=false" >> "$GITHUB_OUTPUT"
            node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human
            gh issue comment "$ISSUE" --body "The build station has hit its attempt cap for this issue. The line is parked — a person should read the attempts above and decide, then remove \`needs-human\` and re-approve the spec PR to try again."
            node "$ADLC/scripts/attempts.mjs" reset "$ISSUE" build # the park itself starts a fresh cycle for the next human-initiated try
          fi

      - name: The Executor is at work
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true'
        run: node "$ADLC/scripts/labels.mjs" state "$ISSUE" building

      - name: Branch the implementation from the approved spec head
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true'
        run: |
          git config user.name "adlc-line"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "spec/$SLUG" main
          git checkout -B "impl/$SLUG" "origin/spec/$SLUG"
          # Then bring main in. A spec branch cut before a change to the line carries that
          # change's absence — the first build here ran a req-coverage predating the fix that
          # was supposed to guard it. Merging also means the delta arrives with main's history
          # behind it, so the delta files never collide add/add at Gate 2.
          if ! git merge --no-edit origin/main; then
            git merge --abort || true
            gh issue comment "$ISSUE" --body "The approved spec branch \`spec/$SLUG\` conflicts with \`main\` and the line will not guess at a resolution — parked for a human. Rebase or re-run the spec station once \`main\` and the delta agree."
            node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human
            exit 1
          fi

      - name: Bring the reproduce evidence, if a bug travelled here
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true'
        run: |
          mkdir -p work
          RUN=$(node "$ADLC/scripts/links.mjs" read "$ISSUE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).repro_run??""))')
          if [ -n "$RUN" ]; then
            gh run download "$RUN" -n "repro-$ISSUE" -D work/repro \
              && git apply work/repro/repro.patch \
              && echo "REPRO=The failing test from the reproduce station is already applied to the working tree — it is your red test." >> "$GITHUB_ENV" \
              || echo "::warning::Reproduce artifact from run $RUN could not be applied — the Executor writes the red test from the spec instead."
          fi

      - name: Install the agent CLI
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Build it (the Executor)
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true'
        shell: bash # pipefail: a crashed agent must fail this step, not be hidden by tee
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          bash "$ADLC/scripts/run-station.sh" "$ADLC/prompts/build.md" \
            "Read,Grep,Glob,Edit,Write,Bash(node:*),Bash(npm:*)" \
            "The delta is \`openspec/changes/$SLUG/\`." \
            "${REPRO:-}" \
            | tee work/build.md

      - name: The line's own tools must be untouched
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true' && env.ADLC == '.adlc'
        run: |
          if [ -n "$(git -C .adlc status --porcelain)" ]; then
            echo "::error::The agent modified the line's own prompts or scripts (.adlc/) — refusing to continue."
            exit 1
          fi

      - name: The adopter's dependencies — the line runs their code, so it installs it
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true'
        run: bash "$ADLC/scripts/install-deps.sh"

      # The deterministic gate. Red gate, no PR — the run stops and reports what it tried.
      - name: The gate
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true'
        id: verify
        run: |
          if npm run verify; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Red gate — report to the issue, no PR
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true' && steps.verify.outputs.green == 'false'
        run: |
          # The build report is model output, so it travels as a file — see this file's header.
          { printf 'The build finished but the deterministic gate is red — no pull request was opened. The build report:\n\n'
            tail -c 60000 work/build.md
          } > work/red-gate.md
          gh issue comment "$ISSUE" --body-file work/red-gate.md
          node "$ADLC/scripts/labels.mjs" add "$ISSUE" needs-human
          exit 1

      # The reviewer gets a fresh session: the diff, the standards, and no memory of writing
      # either. Its findings go in the PR body — where the human at Gate 2 reads them.
      - name: Independent review, fresh context
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true' && steps.verify.outputs.green == 'true'
        shell: bash # pipefail
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          bash "$ADLC/scripts/run-station.sh" "$ADLC/prompts/review.md" \
            "Read,Grep,Glob,Bash(node:*),Bash(npm:*),Bash(git:*)" \
            | tee work/review.md

      - name: Open the implementation PR — never merge it
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true' && steps.verify.outputs.green == 'true'
        id: pr
        run: |
          # Stage everything the gate just verified — except the run's own scratch. (The
          # working tree IS what npm run verify passed; under-staging would ship a PR that
          # differs from what was verified.)
          git add -A -- . ':!work' ':!.adlc' ':!node_modules'
          git commit -m "impl: $SLUG

          Built from the spec delta approved at Gate 1 (spec PR stays open until this merges).
          Relates to #$ISSUE"
          git push -f -u origin "impl/$SLUG"
          { cat work/review.md
            printf '\n\n---\n\nThe independent drift verdict lands below as a comment when the verifier finishes.\n\nCloses #%s\nRelates to #%s\n' "$ISSUE" "$ISSUE"
          } > work/pr-body.md
          # A rebuild after a spec revision pushes to a branch that already has a PR, and
          # gh pr create fails on that — which abandoned the run one step from the end,
          # skipping the verifier handoff while finished work sat on the branch. The spec
          # station has always reused its PR this way; this one now does too.
          EXISTING=$(gh pr list --head "impl/$SLUG" --state open --json url --jq '.[0].url // empty')
          if [ -n "$EXISTING" ]; then
            URL="$EXISTING"
            gh pr comment "$URL" --body-file work/pr-body.md
            echo "Implementation PR already open: $URL (rebuilt after a spec revision)."
          else
            URL=$(gh pr create --base "${{ github.event.repository.default_branch || 'main' }}" --head "impl/$SLUG" \
              --title "impl: $SLUG" --body-file work/pr-body.md)
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # Bot-opened PRs start no pull_request workflows, so the gate's verdict becomes a
          # commit status the branch protection can require.
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=success -f context=adlc/verify -f description="npm run verify green in the build run" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::Could not set the commit status."

      - name: Record the link, hand to the verifier
        if: env.GO == 'true' && steps.attempts.outputs.within == 'true' && steps.verify.outputs.green == 'true'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          node "$ADLC/scripts/links.mjs" write "$ISSUE" \
            implementation_pr="$PR_URL" \
            --note "Implementation opened: $PR_URL — the independent verifier has been dispatched."
          node "$ADLC/scripts/labels.mjs" state "$ISSUE" verifying
          gh workflow run verifier.yml -f issue_number="$ISSUE" \
            || { echo "::warning::Verifier could not be dispatched — run it manually: gh workflow run verifier.yml -f issue_number=$ISSUE"; gh issue comment "$ISSUE" --body "The implementation PR is open, but the verifier could not be dispatched automatically. Run it with: \`gh workflow run verifier.yml -f issue_number=$ISSUE\`"; }

      - name: Keep the evidence
        if: always() && env.GO == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ env.ISSUE }}-${{ github.run_id }}
          path: work/
          if-no-files-found: ignore
