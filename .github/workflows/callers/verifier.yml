# Caller: verifier — copy into your repo as .github/workflows/verifier.yml
name: verifier
on:
  workflow_dispatch:
    inputs:
      issue_number: { description: "Source issue", required: true, type: string }
# No concurrency block here on purpose. The station this calls declares its own, and a
# called workflow DOES apply it — so naming the same group in both makes the station wait
# for a group its own caller is holding, and the run dies as a workflow file issue before
# any job starts. The station owns serialisation; the caller must not restate it.
jobs:
  verifier:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    uses: raunakkathuria/adlc/.github/workflows/verifier.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
      adlc_ref: v1
      # Your app is not this repo's app. Uncomment and set these two to whatever starts
      # yours and whatever answers 200 once it is up; the station derives the base URL it
      # gives the agent from health_url, so there is no third thing to set.
      # start_command: npm start
      # health_url: http://localhost:8080/health
    secrets: inherit
