# Caller: intake — copy into your repo as .github/workflows/intake.yml
name: intake
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number: { description: "Issue to (re-)run intake for", required: true, type: string }
# No concurrency block here on purpose. The station this calls declares its own, and a
# called workflow DOES apply it — so naming the same group in both makes the station wait
# for a group its own caller is holding, and the run dies as a workflow file issue before
# any job starts. The station owns serialisation; the caller must not restate it.
jobs:
  intake:
    permissions:
      contents: read
      issues: write
      actions: write
    uses: raunakkathuria/adlc/.github/workflows/intake.yml@v1
    with:
      issue_number: ${{ format('{0}', github.event.issue.number || inputs.issue_number) }}
      adlc_ref: v1
    secrets: inherit
