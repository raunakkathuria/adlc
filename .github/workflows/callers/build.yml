# Caller: build — copy into your repo as .github/workflows/build.yml
name: build
on:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pr_number: { description: "Approved spec PR number", required: true, type: string }
# No concurrency block here on purpose. The station this calls declares its own, and a
# called workflow DOES apply it — so naming the same group in both makes the station wait
# for a group its own caller is holding, and the run dies as a workflow file issue before
# any job starts. The station owns serialisation; the caller must not restate it.
jobs:
  build:
    if: github.event_name != 'pull_request_review' || (github.event.review.state == 'approved' && startsWith(github.event.pull_request.head.ref, 'spec/'))
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
      statuses: write
    uses: raunakkathuria/adlc/.github/workflows/build.yml@v1
    with:
      pr_number: ${{ format('{0}', github.event.pull_request.number || inputs.pr_number) }}
      adlc_ref: v1
    secrets: inherit
