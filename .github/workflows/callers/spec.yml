# Caller: spec — copy into your repo as .github/workflows/spec.yml
name: spec
on:
  workflow_dispatch:
    inputs:
      issue_number: { description: "Source issue", required: true, type: string }
      slug: { description: "Change slug", required: true, type: string }
# No concurrency block here on purpose. The station this calls declares its own, and a
# called workflow DOES apply it — so naming the same group in both makes the station wait
# for a group its own caller is holding, and the run dies as a workflow file issue before
# any job starts. The station owns serialisation; the caller must not restate it.
jobs:
  spec:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: raunakkathuria/adlc/.github/workflows/spec.yml@v1
    with:
      issue_number: ${{ inputs.issue_number }}
      slug: ${{ inputs.slug }}
      adlc_ref: v1
    secrets: inherit
