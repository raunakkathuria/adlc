# Caller: quality — copy into your repo as .github/workflows/quality.yml
name: quality
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      pr_number: { description: "Implementation PR (verify mode); blank = explore", required: false, type: string }
      issue_number: { description: "Source issue (verify mode)", required: false, type: string }
      query: { description: "Focus (explore mode)", required: false, type: string }
# No concurrency block here on purpose. The station this calls declares its own, and a
# called workflow DOES apply it — so naming the same group in both makes the station wait
# for a group its own caller is holding, and the run dies as a workflow file issue before
# any job starts. The station owns serialisation; the caller must not restate it.
jobs:
  quality:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    uses: raunakkathuria/adlc/.github/workflows/quality.yml@v1
    with:
      pr_number: ${{ inputs.pr_number }}
      issue_number: ${{ inputs.issue_number }}
      query: ${{ inputs.query }}
      adlc_ref: v1
    secrets: inherit
