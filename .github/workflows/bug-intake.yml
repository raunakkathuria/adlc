# The unattended loop: an issue arrives, and the bug path runs as far as a pull request.
#
# This is the workshop's three exercises with nobody at the keyboard. The prompts are the same
# files in prompts/ — nothing is duplicated here, which is the point. Read it top to bottom and
# you have read the whole loop.
#
# It is OFF unless someone adds an ANTHROPIC_API_KEY secret. Without one the job runs, says so,
# and stops. That is a deliberate default: a repo that can open pull requests on its own should
# require a human to switch it on.
#
# What it never does: merge. Gate 2 is a person.

name: bug intake

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Is the runner switched on?
        id: runner
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "No ANTHROPIC_API_KEY secret. The loop stays off — this workflow is documentation."
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the agent CLI
        if: steps.runner.outputs.on == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Intake: anything in, one shape out. The issue becomes a file in the repo, so every
      # later step reads the same text and the run is reproducible from the commit alone.
      - name: Take the issue in
        if: steps.runner.outputs.on == 'true'
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p issues
          {
            printf -- '---\nid: %s\nsource: github\n---\n\n# %s\n\n%s\n' "$NUMBER" "$TITLE" "$BODY"
          } > "issues/gh-$NUMBER.md"

      - name: Classify it
        if: steps.runner.outputs.on == 'true'
        id: triage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          { cat prompts/triage.md
            printf '\n\nThe issue to classify is `issues/gh-%s.md`.\n' "${{ github.event.issue.number }}"
          } | claude -p --allowedTools "Read Grep Glob" > triage.json
          cat triage.json
          echo "class=$(node -e 'const t=require("fs").readFileSync("triage.json","utf8");console.log((t.match(/"class"\s*:\s*"(\w+)"/)||[])[1]||"unknown")')" >> "$GITHUB_OUTPUT"

      # Only the bug path is automated here. A behaviour change needs a spec delta and a human
      # at Gate 1, so it stops before any code is written — see the 05:02 run in
      # artifacts/overnight/.
      - name: Not a bug — stop and say why
        if: steps.runner.outputs.on == 'true' && steps.triage.outputs.class != 'bug'
        run: |
          echo "Classified as '${{ steps.triage.outputs.class }}'. The bug path does not apply."
          echo "A behaviour change needs a spec delta approved at Gate 1 before any code exists."

      # Reproduce first. If the bug cannot be surfaced through the API, this step reports that
      # and writes no test — and the run stops here with its findings, rather than guessing.
      - name: Reproduce it
        if: steps.runner.outputs.on == 'true' && steps.triage.outputs.class == 'bug'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          sed 's|issues/001-rejected-order-eats-stock.md|issues/gh-${{ github.event.issue.number }}.md|g' \
            prompts/reproduce.md \
            | claude -p --allowedTools "Read Grep Glob Edit Write Bash(node:*) Bash(npm:*)" \
            | tee reproduce.md

      # A failing test is what makes the bug real. If npm test is green, nothing was reproduced,
      # so there is nothing to fix and a human should look at the report.
      - name: Did anything actually fail?
        if: steps.runner.outputs.on == 'true' && steps.triage.outputs.class == 'bug'
        id: red
        run: |
          if npm test; then
            echo "Tests are green — the bug was not reproduced. Escalating to a human."
            echo "reproduced=false" >> "$GITHUB_OUTPUT"
          else
            echo "reproduced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix it
        if: steps.runner.outputs.on == 'true' && steps.red.outputs.reproduced == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cat prompts/fix.md | claude -p --allowedTools "Read Grep Glob Edit Write Bash(node:*) Bash(npm:*)"

      # The reviewer gets a fresh session. It has the diff and the standards, and no memory of
      # writing either the test or the fix. That independence is the whole reason it is useful.
      - name: Review it
        if: steps.runner.outputs.on == 'true' && steps.red.outputs.reproduced == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: cat prompts/review.md | claude -p --allowedTools "Read Grep Glob Bash(node:*) Bash(npm:*) Bash(git:*)" | tee review.md

      - name: The gate
        if: steps.runner.outputs.on == 'true' && steps.red.outputs.reproduced == 'true'
        run: npm run verify

      - name: Open a pull request — never merge one
        if: steps.runner.outputs.on == 'true' && steps.red.outputs.reproduced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="fix/issue-${{ github.event.issue.number }}"
          git config user.name "bug-intake"
          git config user.email "bug-intake@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add app test issues
          git commit -m "fix: ${{ github.event.issue.title }}

          Reproduced by a failing test, then fixed. Reviewed by an independent pass.
          Closes #${{ github.event.issue.number }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "fix: ${{ github.event.issue.title }}" \
            --body-file review.md \
            --base "${{ github.event.repository.default_branch }}"

      - name: Report back on the issue
        if: steps.runner.outputs.on == 'true' && steps.red.outputs.reproduced == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body-file reproduce.md
          gh issue edit "${{ github.event.issue.number }}" --add-label "needs-human"

      - name: Keep the evidence either way
        if: steps.runner.outputs.on == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.event.issue.number }}
          path: |
            triage.json
            reproduce.md
            review.md
          if-no-files-found: ignore
