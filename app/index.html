<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storefront</title>
<style>
  :root {
    --bg: #fbfbfa; --surface: #ffffff; --ink: #191c26; --muted: #6b7180;
    --line: #e4e4e2; --accent: #191c26; --bad: #b3261e; --good: #1d6b3f;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161c; --surface: #1c1f27; --ink: #ececee; --muted: #9aa0ae;
      --line: #2c303a; --accent: #ececee; --bad: #f2b8b5; --good: #7fd3a2;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.5; }
  main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: -0.01em; }
  p.sub { margin: 0 0 1.75rem; color: var(--muted); font-size: .875rem; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 2rem 0 .75rem; font-weight: 600; }
  input, button { font: inherit; }
  input[type=search], input[type=number] {
    padding: .5rem .7rem; border: 1px solid var(--line); border-radius: 7px;
    background: var(--surface); color: var(--ink);
  }
  input[type=search] { width: 100%; }
  input[type=text] {
    padding: .5rem .7rem; border: 1px solid var(--line); border-radius: 7px;
    background: var(--surface); color: var(--ink); width: 9rem;
  }
  input[aria-invalid=true] { border-color: var(--bad); }
  .filters { display: flex; gap: .5rem; }
  .search-field { flex: 1; min-width: 0; }
  .search-field label { display: block; font-size: .8rem; color: var(--muted); margin: 0 0 .25rem; }
  .filters { align-items: flex-end; }
  .field-error { color: var(--bad); font-size: .8rem; margin: .35rem 0 0; }
  input[type=number] { width: 4.5rem; text-align: right; }
  button {
    padding: .5rem .9rem; border: 1px solid var(--accent); border-radius: 7px;
    background: var(--accent); color: var(--bg); cursor: pointer;
  }
  button:hover { opacity: .88; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .cards { list-style: none; padding: 0; margin: 0; }
  .card {
    display: flex; align-items: center; gap: .75rem; padding: .85rem 1rem;
    border: 1px solid var(--line); border-radius: 9px; background: var(--surface);
    margin-bottom: .5rem;
  }
  .card .name { font-weight: 550; }
  .card .meta { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
  .grow { flex: 1; min-width: 0; }
  .note {
    padding: .7rem .9rem; border-radius: 8px; margin: .75rem 0 0; font-size: .875rem;
    border: 1px solid var(--line); background: var(--surface);
  }
  .note.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
  .note.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
  .empty { color: var(--muted); font-size: .875rem; padding: .5rem 0; }
  li.bare { list-style: none; margin-left: -1.25rem; }
  button.retry {
    margin-left: .6rem; padding: .25rem .6rem; font-size: .8rem;
    background: transparent; color: inherit; border-color: currentColor;
  }
  ol { padding-left: 1.25rem; margin: 0; color: var(--muted); font-size: .875rem; }
  code { font-size: .85em; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<main>
  <h1>Storefront</h1>
  <p class="sub">Search the catalogue, then order what you need. Stock updates as orders are placed.</p>

  <div class="filters">
    <div class="search-field">
      <label for="q">Search the catalogue</label>
      <input type="search" id="q" aria-label="Search the catalogue" placeholder="Search the catalogue — try “mug”, or a SKU like “BOOK-1”" autocomplete="off">
    </div>
    <input type="text" id="max-price" inputmode="decimal" aria-label="Maximum price" placeholder="Max price (£)" autocomplete="off">
  </div>
  <div id="price-error" class="field-error"></div>

  <h2>Catalogue</h2>
  <div id="items"></div>
  <p id="summary" class="visually-hidden" role="status"></p>
  <div id="note" role="status"></div>

  <h2>Orders</h2>
  <ol id="orders"></ol>
</main>

<script>
const money = (cents) => '£' + (cents / 100).toFixed(2);
const el = (id) => document.getElementById(id);

// A request that never lands, or a reply that is not JSON, is a failure the shopper has to be
// told about — not an exception thrown past every caller. `ok: false` is that, in a value.
async function api(path, options) {
  try {
    const res = await fetch('/api' + path, options);
    return { ok: true, status: res.status, body: await res.json() };
  } catch (err) {
    console.warn('request failed', path, err);
    return { ok: false, status: 0, body: null };
  }
}

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

// Every failure message carries its own way out. Both retry everything, because the failure
// that actually happens is the server going away, which takes both loads down together.
const retryButton = (id) => ` <button type="button" class="retry" id="${id}">Try again</button>`;

function onRetry(id) {
  el(id)?.addEventListener('click', () => { loadItems(); loadOrders(); });
}

// A not-sent message is the only sign the order may not exist (REQ-ORD-11), so a new search
// leaves it alone; every other outcome is cleared when the trimmed query changes (REQ-ORD-7).
let notSentShowing = false;

function note(message, kind, { notSent = false } = {}) {
  notSentShowing = notSent;
  el('note').innerHTML = message ? `<p class="note ${kind}">${message}</p>` : '';
}

// `ceiling` is cents, or null for none. The amount is the page's own formatting, never typed text.
function summaryText(q, count, ceiling) {
  const cap = ceiling === null ? '' : ` at ${money(ceiling)} or less`;
  if (!q) return count === 1 ? `Showing 1 item${cap}.` : `Showing ${count} items${cap}.`;
  if (count === 0) return `Nothing matches “${escapeHtml(q)}”${cap}.`;
  return count === 1 ? `1 item matches “${escapeHtml(q)}”${cap}.` : `${count} items match “${escapeHtml(q)}”${cap}.`;
}

function emptyText(q, ceiling) {
  if (ceiling === null) return q ? `Nothing matches “${escapeHtml(q)}”.` : 'The catalogue is empty.';
  return q ? summaryText(q, 0, ceiling) : `Nothing costs ${money(ceiling)} or less.`;
}

// What the maximum-price field holds: nothing, a price (in cents), a price still being typed,
// or something that cannot be a price. Whole pounds take at most 13 digits so the cents stay
// below 2^53 and money() shows them exactly. Cents come from the digits, never from a float.
const PRICE_REFUSAL = 'Enter a maximum price such as 10 or 10.50.';

function readPrice(text) {
  const raw = text.trim();
  if (raw === '') return { state: 'empty' };
  if (/^[0-9]{0,13}\.$/.test(raw)) return { state: 'incomplete' };
  const m = /^(?:([0-9]{1,13})(?:\.([0-9]{1,2}))?|\.([0-9]{1,2}))$/.exec(raw);
  if (!m) return { state: 'refused' };
  const pence = m[2] ?? m[3] ?? '';
  const tens = pence.length === 1 ? Number(pence) * 10 : Number(pence || 0);
  return { state: 'price', cents: Number(m[1] ?? 0) * 100 + tens };
}

// What the page's most recent item-list request carried; an incomplete or refused field
// leaves it alone, so a typo never widens the list.
let appliedCeiling = null;

// The hold on an Order button belongs to the item, not to the rendered button (REQ-ORD-14):
// every render asks `inFlight`, so a re-render, or the item coming back, cannot lose it. The
// stock last drawn on a card is kept so that releasing a hold defers to REQ-ORD-13 at zero.
const inFlight = new Set();
const shownStock = new Map();

function syncOrderButton(sku) {
  const button = [...el('items').querySelectorAll('button')].find((b) => b.dataset.sku === sku);
  if (button) button.disabled = inFlight.has(sku) || shownStock.get(sku) === 0;
}

// Keyboard focus survives the post-order refresh (REQ-ORD-15). The refresh replaces every card,
// so where focus is gets noted just before the swap and put back on its replacement just after.
// `lastOrderedWithFocus` is the item whose Order button was most recently operated while it held
// focus: the home for focus that has dropped to the page, whether the shopper clicked blank space
// or the button was disabled while its order was in flight (REQ-ORD-14).
let lastOrderedWithFocus = null;

function focusToRestore() {
  const active = document.activeElement;
  if (!active || active === document.body) {
    return lastOrderedWithFocus === null ? null : { sku: lastOrderedWithFocus, kind: 'BUTTON' };
  }
  const card = active.closest('li.card');
  if (!card) return null; // a control outside the list: the shopper's, left where it is
  return { sku: card.dataset.sku, kind: active.tagName };
}

// The replacement control if it can hold focus; otherwise the nearest thing that can: the
// button gives way to the quantity input, and both give way to the card (REQ-ORD-13, REQ-ORD-14).
function restoreFocus({ sku, kind }) {
  const card = [...el('items').querySelectorAll('li.card')].find((c) => c.dataset.sku === sku);
  if (!card) return;
  const button = card.querySelector('button');
  const input = card.querySelector('input');
  const candidates = kind === 'BUTTON' ? [button, input, card] : kind === 'INPUT' ? [input, card] : [card];
  candidates.find((c) => c && !c.disabled)?.focus();
}

const CATALOGUE_FAILED = 'Could not load the catalogue. Check your connection.';
const HISTORY_FAILED = 'Could not load your orders. Check your connection.';
const ORDER_FAILED = 'Could not reach the server — your order was not sent. Check your connection and try again.';

const REJECTIONS = {
  over_limit: 'Rejected — no more than 20 units per order.',
  insufficient_stock: 'Rejected — not enough in stock.',
  unknown_sku: 'Rejected — no such item.',
  invalid_qty: 'Rejected — quantity must be a whole number, at least 1.',
};

// The most recently issued request for the item list wins — reserving a slot up front (rather
// than only once a response arrives) means a slow request started earlier always loses to a
// faster one started later, no matter which resolves first.
let requestSeq = 0;
const nextRequestSeq = () => ++requestSeq;

async function loadItems({ announce = true, query, seq, keepFocus = false } = {}) {
  const mySeq = seq ?? nextRequestSeq();
  const q = (query ?? el('q').value).trim();
  const price = readPrice(el('max-price').value);
  if (price.state === 'price') appliedCeiling = price.cents;
  else if (price.state === 'empty') appliedCeiling = null;
  const ceiling = appliedCeiling;
  const params = [];
  if (q) params.push('q=' + encodeURIComponent(q));
  if (ceiling !== null) params.push('max_price=' + ceiling);
  const { ok, body: items } = await api('/items' + (params.length ? '?' + params.join('&') : ''));

  if (mySeq !== requestSeq) return; // superseded by a newer request; discard

  if (!ok || !Array.isArray(items)) {
    // A failure is not an empty catalogue, and it is not a search that matched nothing. The
    // summary still follows `announce`: REQ-CAT-7 promises the post-order refresh leaves that
    // region alone, and the order's own outcome has already spoken through #note.
    el('items').innerHTML = `<p class="note bad">${CATALOGUE_FAILED}${retryButton('retry-items')}</p>`;
    onRetry('retry-items');
    if (announce) el('summary').innerHTML = CATALOGUE_FAILED;
    return;
  }

  if (items.length === 0) {
    // No query and no ceiling means nothing narrowed the list, so the catalogue itself is empty.
    el('items').innerHTML = `<p class="empty">${emptyText(q, ceiling)}</p>`;
  } else {
    for (const item of items) shownStock.set(item.sku, item.stock);
    const focusAfter = keepFocus ? focusToRestore() : null;
    el('items').innerHTML = `<ul class="cards" role="list">` + items.map((item) => `
      <li class="card" tabindex="-1" data-sku="${escapeHtml(item.sku)}">
        <div class="grow">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="meta">${escapeHtml(item.sku)} · ${money(item.price)} · <span id="stock-${escapeHtml(item.sku)}">${escapeHtml(item.stock)} in stock</span></div>
        </div>
        <input type="number" min="1" max="${Math.min(20, item.stock)}" value="1" id="qty-${escapeHtml(item.sku)}" aria-label="Quantity of ${escapeHtml(item.name)}"${item.stock === 0 ? ` disabled aria-describedby="stock-${escapeHtml(item.sku)}"` : ''}>
        <button data-sku="${escapeHtml(item.sku)}" aria-label="Order ${escapeHtml(item.name)}"${item.stock === 0 ? ` disabled aria-describedby="stock-${escapeHtml(item.sku)}"` : inFlight.has(item.sku) ? ' disabled' : ''}>Order</button>
      </li>
    `).join('') + `</ul>`;

    for (const button of el('items').querySelectorAll('button')) {
      button.addEventListener('click', () => order(button.dataset.sku));
    }
    if (focusAfter) restoreFocus(focusAfter);
  }

  if (announce) el('summary').innerHTML = summaryText(q, items.length, ceiling);
}

async function loadOrders() {
  const { ok, body: orders } = await api('/orders');
  if (!ok || !Array.isArray(orders)) {
    el('orders').innerHTML = `<li class="empty bare">${HISTORY_FAILED}${retryButton('retry-orders')}</li>`;
    onRetry('retry-orders');
    return;
  }
  el('orders').innerHTML = orders.length
    ? orders.map((o) => `<li>#${escapeHtml(o.id)} — ${escapeHtml(o.qty)} × ${escapeHtml(o.name)} (${escapeHtml(o.sku)}) — ${money(o.total)}</li>`).join('')
    : '<li class="empty bare">No orders yet.</li>';
}

async function order(sku) {
  const query = el('q').value;
  const placedUnder = query.trim();
  const active = document.activeElement;
  if (active?.tagName === 'BUTTON' && active.dataset.sku === sku) lastOrderedWithFocus = sku;
  const seq = nextRequestSeq(); // reserve the refresh's place in line right away, not once it fires
  const qty = Number(el('qty-' + sku).value);
  inFlight.add(sku);
  syncOrderButton(sku);
  const { ok, status, body } = await api('/orders', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ sku, qty }),
  });

  // An outcome for a different search than the one it now sits beside is not shown; a not-sent
  // message is, because nothing else tells the shopper the order may not exist.
  if (!ok) {
    note(ORDER_FAILED, 'bad', { notSent: true });
  } else if (el('q').value.trim() !== placedUnder) {
    // withheld: the order is in the history, the region stays as the clearing left it
  } else if (status === 201) {
    note(`Order #${escapeHtml(body.id)} placed — ${escapeHtml(body.qty)} × ${escapeHtml(body.name)} (${escapeHtml(body.sku)}) for ${money(body.total)}.`, 'good');
  } else {
    const reason = body && Object.hasOwn(REJECTIONS, body.reason) ? REJECTIONS[body.reason] : null;
    note(reason ?? 'Rejected — the order could not be placed.', 'bad');
  }

  // The outcome is known: the button returns now, not when the refresh below arrives.
  inFlight.delete(sku);
  syncOrderButton(sku);

  await loadItems({ announce: false, query, seq, keepFocus: true });
  await loadOrders();
}

let appliedQuery = '';

el('q').addEventListener('input', () => {
  const trimmed = el('q').value.trim();
  if (trimmed !== appliedQuery) {
    appliedQuery = trimmed;
    if (!notSentShowing) note('');
  }
  return loadItems();
});

// Refusing issues no request, so a response already in flight is still the latest and is shown;
// showing it never touches the message here, which only a change of the field clears.
function showRefusal(refused) {
  el('price-error').innerHTML = refused ? PRICE_REFUSAL : '';
  const field = el('max-price');
  if (refused) {
    field.setAttribute('aria-invalid', 'true');
    field.setAttribute('aria-describedby', 'price-error');
  } else {
    field.removeAttribute('aria-invalid');
    field.removeAttribute('aria-describedby');
  }
}

el('max-price').addEventListener('input', () => {
  const { state } = readPrice(el('max-price').value);
  showRefusal(state === 'refused');
  if (state === 'refused') el('summary').innerHTML = PRICE_REFUSAL;
  if (state === 'price' || state === 'empty') return loadItems();
});
loadItems();
loadOrders();
</script>
</body>
</html>
